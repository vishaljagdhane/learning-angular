<div class="main-banner">
  <div class="content-data">

    <h1>Welcome to Angular Tutorial</h1>

    <div class="datatype-card">
      <h2>String Data Type</h2>

      <p>
        A string is a sequence of characters, typically used to represent text.
      </p>

      <p>
        Declare a string variable in the component file:
      </p>

      <code>
        name: string = 'Vishal';
      </code>

      <p>
        To display the value in HTML:
      </p>

      <code>
        {{ name }}
      </code>

      <p>
        Output:
        {{ name }}
      </p>

    </div>

  </div>
</div>
